<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅游网站首页</title>
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/one.css">
</head>
<body>
    <div class="slider">
        <div class="slides">
            <div class="slide"><img src="/photo/two1.jpg" alt="Slide 1"></div>
            <div class="slide"><img src="/photo/1.jpg" alt="Slide 2"></div>
            <div class="slide"><img src="/photo/2.jpg" alt="Slide 3"></div>
            <div class="slide"><img src="/photo/3.jpg" alt="Slide 4"></div>
            <div class="slide"><img src="/photo/4.jpg" alt="Slide 5"></div>
            <div class="slide"><img src="/photo/5.jpg" alt="Slide 6"></div>
            <div class="slide"><img src="/photo/6.jpg" alt="Slide 7"></div>
            <div class="slide"><img src="/photo/7.jpg" alt="Slide 8"></div>
            <div class="slide"><img src="/photo/8.jpg" alt="Slide 9"></div>
        </div>
        <button class="prev" onclick="prevSlide()">&#10094;</button>
        <button class="next" onclick="nextSlide()">&#10095;</button>
    </div>
    <div class="content">
        <h1>(课设作业)</h1>
        <h2 style="font-family: kaiti; font-size: 40px;">欢迎来到我们的旅游网站</h2>
        <p style="font-family: kaiti; font-size: 30px;">探索世界的美丽与奇迹</p>
        <a href="#destinations" class="button">查看服务</a>
    </div>
    <script src="/js/one.js"></script>
</body>
</html>
