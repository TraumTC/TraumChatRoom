server:
  port: 8080

spring:
  application:
    name: TraumChatRoom
  profiles:
    # 默认使用开发配置（application-dev.yml）。生产环境必须用 --spring.profiles.active=prod
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/NewChatDB}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          max-wait: 2000
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
# MyBatis
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 文件存储
file:
    upload-dir: D:/Javawork/TraumChatRoom/uploads/
    allowed-types: jpg,jpeg,png,gif,bmp,webp,pdf,doc,docx,zip,rar,md,mp4,webm,ogg,mov,avi
    max-file-size: 104857600
    # 头像文件 大小max
    avatar-max-size: 5MB

# AI 配置 (DeepSeek-V3)
ai:
  api:
    url: https://api.deepseek.com/v1/chat/completions
    key: ${AI_API_KEY:}
    model: deepseek-chat
    max-tokens: 1024
    temperature: 0.7
    timeout: 30000
    system-prompt: "你是小爱，一个友善的AI助手。你在一个聊天室中，用户通过@小爱来和你对话。请简洁友好地回答问题，控制在30字以内。"
  rate-limit:
    max-per-minute: 3

# JWT 配置（密钥必须通过环境变量注入，禁止硬编码默认值）
jwt:
  secret: ${JWT_SECRET:}
  access-expiration: 86400000
  refresh-expiration: 604800000

# CORS 配置
cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

